<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SV Betel Farm Exports</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0b6b34,#0f8c44);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.card{

width:360px;
background:white;
border-radius:20px;
padding:35px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.logo{

width:95px;
height:95px;
border-radius:50%;
background:#0b6b34;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
margin:auto;

}

h1{

margin-top:18px;
color:#0b6b34;
font-size:26px;

}

p{

margin-top:8px;
color:#666;
font-size:15px;

}

.btn{

display:block;
margin-top:18px;
padding:15px;
border-radius:12px;
text-decoration:none;
font-size:17px;
font-weight:600;
color:white;
transition:.3s;

}

.whatsapp{

background:#25D366;

}

.whatsapp:hover{

background:#1ba851;

}

.maps{

background:#4285F4;

}

.maps:hover{

background:#2d6fe0;

}

.call{

background:#ff9800;

}

.call:hover{

background:#e48b00;

}

.footer{

margin-top:25px;
font-size:13px;
color:#777;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">SV</div>

<h1>SV Betel Farm Exports</h1>

<p>Fresh & Premium Betel Leaves</p>

<a class="btn whatsapp"
href="https://wa.me/918328069106">
💬 Chat on WhatsApp
</a>

<a class="btn maps"
href="https://maps.app.goo.gl/vZdsqbCmFRygXoxR8">
📍 Open Google Maps
</a>

<a class="btn call"
href="tel:+918328069106">
📞 Call Now
</a>

<div class="footer">

Thank you for visiting ❤️

</div>

</div>

</body>
</html>
